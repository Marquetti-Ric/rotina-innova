name: Licenças de uso

# Toda a gestão de acesso, operável do celular:
# GitHub → Actions → "Licenças de uso" → Run workflow → preencher → Run.
# O código gerado aparece no resumo da execução.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que fazer'
        required: true
        type: choice
        options: [liberar, renovar, nivel4, previa, revogar, listar]
        default: liberar
      apelido:
        description: 'Apelido do usuário (arquivo é PÚBLICO — use apelido, nunca nome completo de criança)'
        required: false
        default: ''
      validade:
        description: 'Válida até (AAAA-MM-DD). Vazio = sem prazo'
        required: false
        default: ''
      codigo:
        description: 'Código existente (renovar, nivel4, previa, revogar)'
        required: false
        default: ''
      titular:
        description: 'Quem responde pela licença (só em liberar)'
        required: false
        type: choice
        options: [pessoa, clinica]
        default: pessoa
      nivel4:
        description: 'Liberar o nível 4, em que o jovem é dono do app (liberar)'
        required: false
        type: boolean
        default: false
      previa:
        description: 'Prévia de idioma — espanhol e inglês incompletos, só para testar (liberar)'
        required: false
        type: boolean
        default: false
      valor:
        description: 'Ligar (sim) ou desligar (não) — para as ações nivel4 e previa'
        required: false
        type: choice
        options: [sim, nao]
        default: sim

permissions:
  contents: write

jobs:
  gerir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # Os valores vão por env, nunca interpolados dentro do shell: apelido é
      # texto livre, e texto livre colado num `run:` é injeção de comando.
      - name: Executar
        id: lic
        env:
          ACAO: ${{ inputs.acao }}
          APELIDO: ${{ inputs.apelido }}
          VALIDADE: ${{ inputs.validade }}
          CODIGO: ${{ inputs.codigo }}
          TITULAR: ${{ inputs.titular }}
          NIVEL4: ${{ inputs.nivel4 }}
          PREVIA: ${{ inputs.previa }}
          VALOR: ${{ inputs.valor }}
        run: |
          # O gerador lê "sim"; o checkbox do GitHub manda "true"/"false".
          n4=$([ "$NIVEL4" = "true" ] && echo sim || echo nao)
          pv=$([ "$PREVIA" = "true" ] && echo sim || echo nao)
          node scripts/licenca.mjs \
            --acao "$ACAO" \
            --apelido "$APELIDO" \
            --validade "$VALIDADE" \
            --codigo "$CODIGO" \
            --titular "$TITULAR" \
            --nivel4 "$n4" \
            --previa "$pv" \
            --valor "$VALOR" \
            >> $GITHUB_STEP_SUMMARY

      - name: Commitar alteração
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/licencas.json
          git diff --cached --quiet && echo "Nada mudou." && exit 0
          git commit -m "Licenças: ${{ inputs.acao }} ${{ inputs.apelido }}"
          git push
