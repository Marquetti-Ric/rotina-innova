name: Gerar o app de iOS

# Build de iOS exige macOS com Xcode, então roda num runner macOS — não dá
# para sair do mesmo ubuntu que gera o APK. Minuto de macOS custa dez vezes
# mais, por isso aqui não roda a suíte de testes: ela já roda no release.
#
# Dois modos, e o padrão não precisa de nada da conta Apple:
#
#   simulador  → compila para o simulador, SEM assinatura. É a checagem de
#                que o projeto nativo compila de verdade. Zero segredo.
#   dispositivo→ gera um .ipa assinado para instalar no aparelho. Só funciona
#                depois que os segredos existirem no repositório; veja
#                ios/LEIA-ME.md.
#
# Pelo celular: GitHub → Actions → "Gerar o app de iOS" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'O que gerar'
        required: true
        default: 'simulador'
        type: choice
        options:
          - simulador
          - dispositivo

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Montar a web e sincronizar o projeto nativo
        run: |
          npm ci
          npm run build
          npx cap sync ios

      # A versão não mora no pbxproj: o `docs/latest.json` é a fonte única,
      # como no Android, onde o release.yml também grava no gradle só na hora
      # de compilar. Duas versões escritas à mão em dois lugares divergem.
      - name: Gravar a versão no projeto iOS
        run: |
          set -e
          NOME=$(node -p "require('./docs/latest.json').versionName")
          CODIGO=$(node -p "require('./docs/latest.json').versionCode")
          echo "versão $NOME (build $CODIGO)"
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = $NOME;/" \
            ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $CODIGO;/" \
            ios/App/App.xcodeproj/project.pbxproj
          grep -c "MARKETING_VERSION = $NOME;" ios/App/App.xcodeproj/project.pbxproj

      # Antes de compilar: o manifesto de privacidade precisa estar DENTRO do
      # bundle, não só na pasta. Sem ele o App Store Connect recusa o envio
      # com ITMS-91053, e a causa é quase sempre a mesma — UserDefaults, que o
      # Preferences do Capacitor usa e quase ninguém declara.
      - name: Conferir o manifesto de privacidade
        run: |
          set -e
          test -f ios/App/App/PrivacyInfo.xcprivacy \
            || { echo "::error::PrivacyInfo.xcprivacy não existe"; exit 1; }
          grep -q "NSPrivacyAccessedAPICategoryUserDefaults" ios/App/App/PrivacyInfo.xcprivacy \
            || { echo "::error::o manifesto não declara UserDefaults"; exit 1; }
          grep -q "CA92.1" ios/App/App/PrivacyInfo.xcprivacy \
            || { echo "::error::falta o código de motivo CA92.1"; exit 1; }
          grep -q "PrivacyInfo.xcprivacy in Resources" ios/App/App.xcodeproj/project.pbxproj \
            || { echo "::error::o manifesto não está na fase Resources: ficaria fora do bundle"; exit 1; }
          echo "manifesto de privacidade: ok"

      - name: Mostrar o Xcode e os esquemas
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -list

      # ---------------------------------------------------------- simulador
      - name: Compilar para o simulador, sem assinatura
        if: inputs.modo == 'simulador'
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Conferir o que saiu
        if: inputs.modo == 'simulador'
        run: |
          set -e
          APP=build-ios/Build/Products/Release-iphonesimulator/App.app
          test -d "$APP" || { echo "::error::não achei o App.app"; exit 1; }
          # O manifesto tem de estar DENTRO do .app, que é o que a Apple lê.
          test -f "$APP/PrivacyInfo.xcprivacy" \
            || { echo "::error::o manifesto não entrou no bundle"; exit 1; }
          # A web tem de ter entrado também, senão o app abre em branco.
          test -f "$APP/public/index.html" \
            || { echo "::error::a pasta public não entrou no bundle"; exit 1; }
          echo "bundle completo: manifesto e web dentro"
          ls -la "$APP"

      - name: Guardar o app do simulador
        if: inputs.modo == 'simulador'
        uses: actions/upload-artifact@v4
        with:
          name: combinado-simulador
          path: build-ios/Build/Products/Release-iphonesimulator/App.app
          retention-days: 14

      # -------------------------------------------------------- dispositivo
      # Nenhum segredo passa por aqui em texto: o certificado é um .p12 em
      # base64 e a senha é segredo do repositório. Quem cria é o Ricardo, na
      # conta dele — este arquivo só consome.
      - name: Conferir os segredos de assinatura
        if: inputs.modo == 'dispositivo'
        env:
          P12: ${{ secrets.IOS_CERTIFICADO_P12 }}
          SENHA: ${{ secrets.IOS_CERTIFICADO_SENHA }}
          PERFIL: ${{ secrets.IOS_PERFIL }}
          TIME: ${{ secrets.IOS_TIME }}
        run: |
          faltam=""
          [ -z "$P12" ] && faltam="$faltam IOS_CERTIFICADO_P12"
          [ -z "$SENHA" ] && faltam="$faltam IOS_CERTIFICADO_SENHA"
          [ -z "$PERFIL" ] && faltam="$faltam IOS_PERFIL"
          [ -z "$TIME" ] && faltam="$faltam IOS_TIME"
          if [ -n "$faltam" ]; then
            echo "::error::faltam os segredos:$faltam — veja ios/LEIA-ME.md"
            exit 1
          fi

      - name: Instalar certificado e perfil no runner
        if: inputs.modo == 'dispositivo'
        env:
          P12: ${{ secrets.IOS_CERTIFICADO_P12 }}
          SENHA: ${{ secrets.IOS_CERTIFICADO_SENHA }}
          PERFIL: ${{ secrets.IOS_PERFIL }}
        run: |
          set -e
          # Chaveiro temporário, que morre com o runner.
          CHAVEIRO="$RUNNER_TEMP/build.keychain"
          SENHA_CHAVEIRO=$(uuidgen)
          security create-keychain -p "$SENHA_CHAVEIRO" "$CHAVEIRO"
          security set-keychain-settings -lut 21600 "$CHAVEIRO"
          security unlock-keychain -p "$SENHA_CHAVEIRO" "$CHAVEIRO"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$CHAVEIRO" -P "$SENHA" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$SENHA_CHAVEIRO" "$CHAVEIRO" > /dev/null
          security list-keychain -d user -s "$CHAVEIRO"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PERFIL" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/combinado.mobileprovision"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Arquivar e exportar o .ipa
        if: inputs.modo == 'dispositivo'
        env:
          TIME: ${{ secrets.IOS_TIME }}
        run: |
          set -e
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$TIME</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TIME" archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Guardar o .ipa
        if: inputs.modo == 'dispositivo'
        uses: actions/upload-artifact@v4
        with:
          name: combinado-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      - name: Limpar o chaveiro
        if: always() && inputs.modo == 'dispositivo'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true
